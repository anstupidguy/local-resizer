<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatchDrop Pro - Local Resizer</title>
    <!-- JSZip library for bundling images into a zip file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #18181b; color: #f4f4f5; padding: 2rem; max-width: 900px; margin: 0 auto; }
        .controls { background: #27272a; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.5rem; display: flex; gap: 1.5rem; align-items: flex-end; flex-wrap: wrap; border: 1px solid #3f3f46; }
        .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { font-size: 0.875rem; color: #a1a1aa; }
        input, select { background: #18181b; color: white; border: 1px solid #3f3f46; padding: 0.5rem; border-radius: 4px; color-scheme: dark; }
        #dropzone { border: 2px dashed #52525b; border-radius: 8px; padding: 4rem 2rem; text-align: center; background: #27272a; transition: all 0.2s; cursor: pointer; }
        #dropzone.dragover { border-color: #10b981; background: #064e3b; }
        #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
        .image-card { background: #27272a; padding: 0.5rem; border-radius: 8px; text-align: center; border: 1px solid #3f3f46; }
        .image-card img { max-width: 100%; height: auto; border-radius: 4px; margin-bottom: 0.5rem; }
        .image-card p { font-size: 12px; margin: 0 0 0.5rem 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #a1a1aa; }
        button, .btn { background: #10b981; color: #022c22; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 0.875rem; font-weight: 600; display: inline-block; }
        button:hover, .btn:hover { background: #34d399; }
        .btn-secondary { background: #3f3f46; color: white; }
        .btn-secondary:hover { background: #52525b; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="header-actions">
        <h1>⚡ BatchDrop Pro</h1>
        <button id="zipBtn" style="display: none;" onclick="downloadZip()">📦 Download All (ZIP)</button>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <label>Max Width (px)</label>
            <input type="number" id="maxWidth" value="1024" style="width: 100px;">
        </div>
        <div class="control-group">
            <label>Format</label>
            <select id="format">
                <option value="image/webp">WebP</option>
                <option value="image/jpeg">JPEG</option>
                <option value="image/png">PNG</option>
            </select>
        </div>
        <div class="control-group">
            <label>Quality (0.1 - 1.0)</label>
            <input type="number" id="quality" value="0.8" step="0.1" min="0.1" max="1.0" style="width: 80px;">
        </div>
        <div class="control-group">
            <label>File Prefix</label>
            <input type="text" id="prefix" placeholder="e.g. hero-img" style="width: 150px;">
        </div>
        <button class="btn-secondary" onclick="savePreset()">💾 Save Preset</button>
    </div>

    <div id="dropzone">
        <h3 style="margin: 0 0 0.5rem 0;">Drag & Drop Unlimited Images Here</h3>
        <p style="margin: 0; color: #a1a1aa;">100% Offline. Processed instantly using your CPU.</p>
    </div>

    <div id="gallery"></div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const gallery = document.getElementById('gallery');
        let processedFiles = []; 
        
        // Load saved preset automatically
        window.onload = function() {
            const saved = localStorage.getItem('batchDropPreset');
            if (saved) {
                const settings = JSON.parse(saved);
                document.getElementById('maxWidth').value = settings.maxWidth;
                document.getElementById('format').value = settings.format;
                document.getElementById('quality').value = settings.quality;
                document.getElementById('prefix').value = settings.prefix;
            }
        };

        function savePreset() {
            const settings = {
                maxWidth: document.getElementById('maxWidth').value,
                format: document.getElementById('format').value,
                quality: document.getElementById('quality').value,
                prefix: document.getElementById('prefix').value
            };
            localStorage.setItem('batchDropPreset', JSON.stringify(settings));
            alert('Settings saved! They will load automatically next time you open this file.');
        }

        // Drag and drop event listeners
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
            document.body.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
        });

        ['dragenter', 'dragover'].forEach(eventName => dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false));
        ['dragleave', 'drop'].forEach(eventName => dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false));

        dropzone.addEventListener('drop', e => {
            const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
            files.forEach(processImage);
        }, false);

        function processImage(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxWidth = parseInt(document.getElementById('maxWidth').value);
                    const format = document.getElementById('format').value;
                    const quality = parseFloat(document.getElementById('quality').value);
                    const prefix = document.getElementById('prefix').value.trim();
                    
                    // Maintain aspect ratio
                    let width = img.width;
                    let height = img.height;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL(format, quality);
                    
                    // Naming logic
                    const ext = format === 'image/jpeg' ? 'jpg' : format.split('/')[1];
                    const originalName = file.name.split('.')[0];
                    const newName = prefix ? `${prefix}-${originalName}.${ext}` : `${originalName}-resized.${ext}`;
                    
                    // Store for ZIP
                    processedFiles.push({ name: newName, data: dataUrl.split(',')[1] });
                    document.getElementById('zipBtn').style.display = 'inline-block';
                    
                    renderOutput(dataUrl, newName);
                }
            }
        }

        function renderOutput(dataUrl, fileName) {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.innerHTML = `
                <img src="${dataUrl}" alt="Resized">
                <p title="${fileName}">${fileName}</p>
                <a href="${dataUrl}" download="${fileName}" class="btn">Download</a>
            `;
            gallery.appendChild(card);
        }

        function downloadZip() {
            const zipBtn = document.getElementById('zipBtn');
            zipBtn.innerText = "⏳ Zipping...";
            
            const zip = new JSZip();
            processedFiles.forEach(file => {
                zip.file(file.name, file.data, {base64: true});
            });
            
            zip.generateAsync({type:"blob"}).then(function(content) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "batchdrop-images.zip";
                link.click();
                zipBtn.innerText = "📦 Download All (ZIP)";
            });
        }
    </script>
</body>
</html>
